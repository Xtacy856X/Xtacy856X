<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="Kappa Sigma">
  <defs>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="55%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#e879f9"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1f2937" stroke-width="1" opacity="0.5"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="280" fill="#0b1020"/>
  <rect width="1200" height="280" fill="url(#grid)"/>
  <circle cx="1040" cy="30" r="150" fill="#22d3ee" opacity="0.12" filter="url(#blur)"/>
  <circle cx="140" cy="260" r="160" fill="#e879f9" opacity="0.12" filter="url(#blur)"/>

  <g font-family="'JetBrains Mono','Fira Code',Consolas,monospace">
    <text x="60" y="118" font-size="56" font-weight="700" fill="url(#name)" letter-spacing="3">KAPPA SIGMA</text>
    <text x="62" y="162" font-size="19" fill="#94a3b8">AI, debugging, PS5 homebrew, time scales</text>
    <text x="62" y="206" font-size="15" fill="#64748b">&gt; patches for opencode, hifitime and the PS5 payload SDK</text>
  </g>

  <rect x="62" y="222" width="9" height="17" fill="#22d3ee">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <line x1="60" y1="248" x2="1140" y2="248" stroke="url(#fade)" stroke-width="1" opacity="0.5"/>
</svg>
